[package]
name = "firkin"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "firkin"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.2"
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
# "abi3-py38" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.8
#features = ["abi3-py38"]
