[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "firkin_units"
authors = [
  { name="Kyle Duke", email="kylehduke@gmail.com" },
]
description = "Unit-attached numbers for scientific or engineering calculations"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/janKaje/firkin"
Issues = "https://github.com/janKaje/firkin/issues"
